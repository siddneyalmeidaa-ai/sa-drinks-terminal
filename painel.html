<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAINEL DO BARMAN - S.A. DRINKS</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0a0a0a; color: white; padding: 15px; }
        h1, h2 { color: #28a745; text-transform: uppercase; border-bottom: 2px solid #1a1a1a; padding-bottom: 10px; letter-spacing: 1px; }
        #lista-pedidos { display: grid; gap: 10px; }
        .pedido-card { 
            background: #161616; border-left: 6px solid #28a745; padding: 15px; 
            border-radius: 10px; display: flex; justify-content: space-between; 
            align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .cliente-nome { color: #28a745; font-weight: bold; font-size: 22px; display: block; }
        .drink-info { font-size: 18px; color: #fff; margin: 5px 0; display: block; }
        .receita-box { font-size: 12px; color: #ffc107; background: #222; padding: 8px; border-radius: 6px; margin: 8px 0; border: 1px solid #333; }
        .tempo-container { margin-top: 8px; font-size: 13px; color: #888; display: flex; gap: 15px; }
        .cronometro { font-weight: bold; padding: 2px 6px; border-radius: 4px; background: #222; }
        .btn-ready { 
            background: #28a745; color: white; border: none; padding: 15px 25px; 
            border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; 
        }
        #relatorio { background: #111; padding: 20px; border-radius: 12px; margin-top: 40px; border: 1px solid #333; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 15px; }
        .stat-box { background: #1c1c1c; padding: 15px; border-radius: 10px; text-align: center; }
        .stat-number { display: block; font-size: 28px; font-weight: bold; color: #ffc107; }
    </style>
</head>
<body>
    <h1>🍸 Pedidos Pendentes</h1>
    <div id="lista-pedidos">Sincronizando S.A. Drinks...</div>

    <div id="relatorio">
        <h2>📊 Relatório da Noite (S.A. DRINKS)</h2>
        <div class="stats-grid" id="stats-vendas">
            <div class="stat-box">
                <span class="stat-number" id="total-geral">0</span>
                Total Geral
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://sa-drinks-terminal-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Receituário S.A. Ajustado
        const RECEITUARIO = {
            "QUANTUM BLUE": "🔵 Curaçau Blue Zero, Limão Siciliano e Soda.",
            "PINK S.A.": "💗 Morango In Natura, Alecrim e Tônica.",
            "TROPICAL YELLOW": "🟡 Abacaxi, Gengibre e Água com Gás.",
            "GREEN VIBE": "🟢 Maçã Verde, Hortelã e Soda.",
            "COFFEE TONIC": "☕ Café Arábica, Caramelo e Tônica.",
            "SUNSET PEACH": "🟠 Pêssego, Limão Taiti e Soda."
        };

        function calcularTempo(ts) {
            if(!ts) return "0m";
            const diff = Math.floor((new Date().getTime() - ts) / 60000);
            return diff > 0 ? diff : 0;
        }

        setInterval(() => {
            document.querySelectorAll('.cronometro').forEach(span => {
                const ts = span.getAttribute('data-ts');
                const min = calcularTempo(parseInt(ts));
                span.innerText = min + " min atrás";
                if(min >= 10) span.style.color = "#ffc107";
                if(min >= 15) span.style.color = "#e63946";
            });
        }, 30000);

        db.ref('pedidos').on('value', (snapshot) => {
            const lista = document.getElementById('lista-pedidos');
            const statsContainer = document.getElementById('stats-vendas');
            const totalGeralElement = document.getElementById('total-geral');
            
            lista.innerHTML = "";
            let totalGeral = 0;
            let contagemDrinks = {};

            snapshot.forEach((item) => {
                const p = item.val();
                const id = item.key;
                
                // Normalização do Status para capturar tudo
                const statusNormalizado = p.status ? p.status.toLowerCase() : "";

                if(statusNormalizado === "pendente" || statusNormalizado === "preparando") {
                    const ts = p.timestamp || p.data || new Date().getTime();
                    const receita = RECEITUARIO[p.drink] || "Receita padrão S.A.";

                    lista.innerHTML += `
                        <div class="pedido-card">
                            <div>
                                <span class="cliente-nome">${p.cliente}</span>
                                <span class="drink-info">Drink: <b>${p.drink}</b></span>
                                <div class="receita-box">📋 ${receita}</div>
                                <div class="tempo-container">
                                    <span>🕒 ${new Date(ts).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})}</span>
                                    <span class="cronometro" data-ts="${ts}">${calcularTempo(ts)} min atrás</span>
                                </div>
                            </div>
                            <button class="btn-ready" onclick="finalizar('${id}')">PRONTO</button>
                        </div>`;
                }

                if(p.status === "PRONTO") {
                    totalGeral++;
                    contagemDrinks[p.drink] = (contagemDrinks[p.drink] || 0) + 1;
                }
            });

            totalGeralElement.innerText = totalGeral;
            document.querySelectorAll('.stat-drink').forEach(box => box.remove());

            for (const [nome, qtd] of Object.entries(contagemDrinks)) {
                statsContainer.innerHTML += `
                    <div class="stat-box stat-drink">
                        <span class="stat-number" style="color:#28a745">${qtd}</span>
                        ${nome}
                    </div>`;
            }
            if (lista.innerHTML === "") lista.innerHTML = "<p style='color:#555; text-align:center;'>Aguardando pedidos...</p>";
        });

        function finalizar(id) {
            db.ref('pedidos/' + id).update({ status: "PRONTO" });
        }
    </script>
</body>
</html>
