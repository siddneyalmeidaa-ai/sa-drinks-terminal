<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A. DRINKS - CLIENTE</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #28a745; --accent: #ff9f43; }
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; padding: 15px; }
        .card { background: #111; border-radius: 15px; margin-bottom: 20px; overflow: hidden; border: 1px solid #222; }
        .img { width: 100%; height: 200px; background-size: cover; background-position: center; }
        .info { padding: 15px; }
        .btn { background: var(--primary); color: #fff; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; }
        #tela-preparo { display: none; text-align: center; padding-top: 50px; }
        .status-badge { color: var(--accent); font-size: 24px; font-weight: bold; margin: 20px 0; display: block; }
    </style>
</head>
<body>

    <div id="app">
        <div id="cardapio">
            <h2 style="text-align:center; color: var(--primary);">S.A. DRINKS</h2>
            <input type="text" id="nome" placeholder="Seu nome..." style="width:100%; padding:15px; margin-bottom:20px; background:#111; color:#fff; border:1px solid #333; border-radius:10px;">
            
            <div id="lista"></div>
        </div>

        <div id="tela-preparo">
            <h2 id="status-txt">AGUARDANDO COMANDO...</h2>
            <span id="status-badge" class="status-badge">EM PREPARO</span>
            <p id="instrucao">Seu drink aparecerá aqui quando estiver pronto.</p>
            <button onclick="location.reload()" style="background:#222; color:#888; border:none; padding:10px; border-radius:5px; margin-top:50px;">NOVO PEDIDO</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://sa-drinks-terminal-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const drinks = [
            { n: "PINK S.A.", c: "TAÇA GIN 480ML", i: "https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=400" },
            { n: "QUANTUM BLUE", c: "COPO LONG DRINK 330ML", i: "https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=400" },
            { n: "TROPICAL YELLOW", c: "COPO HURRICANE 400ML", i: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=400" },
            { n: "GREEN DETOX", c: "COPO ROCKS 250ML", i: "https://images.unsplash.com/photo-1544145945-f904253d0c7b?w=400" },
            { n: "SUNSET PEACH", c: "TAÇA COUPÊ 200ML", i: "https://images.unsplash.com/photo-1536935338788-846bb9981813?w=400" },
            { n: "COFFEE TONIC", c: "COPO HIGHBALL 350ML", i: "https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=400" }
        ];

        const listaDiv = document.getElementById('lista');
        drinks.forEach(d => {
            listaDiv.innerHTML += `
                <div class="card">
                    <div class="img" style="background-image:url('${d.i}')"></div>
                    <div class="info">
                        <b style="color:var(--primary)">${d.n}</b><br>
                        <small style="color:#666">${d.c}</small><br><br>
                        <button class="btn" onclick="fazerPedido('${d.n}')">SOLICITAR</button>
                    </div>
                </div>`;
        });

        function bip() {
            const context = new AudioContext();
            const osc = context.createOscillator();
            const gain = context.createGain();
            osc.connect(gain); gain.connect(context.destination);
            osc.start(); osc.stop(context.currentTime + 0.3);
            if(navigator.vibrate) navigator.vibrate([300, 100, 300]);
        }

        function fazerPedido(drink) {
            const nome = document.getElementById('nome').value;
            if(!nome) return alert("Digite seu nome!");

            const novoPedido = db.ref('pedidos').push();
            novoPedido.set({ cliente: nome, drink: drink, status: "PREPARANDO" });

            document.getElementById('cardapio').style.display = 'none';
            document.getElementById('tela-preparo').style.display = 'block';

            // ESCUTA O COMANDO DO S.A. (VOCÊ)
            novoPedido.on('value', (snap) => {
                const data = snap.val();
                if(data.status === "PRONTO") {
                    bip();
                    document.getElementById('status-txt').innerText = "LIBERADO!";
                    document.getElementById('status-badge').innerText = "✓ PRONTO";
                    document.getElementById('status-badge').style.color = "#28a745";
                    document.getElementById('instrucao').innerText = "Retire agora no balcão!";
                }
            });
        }
    </script>
</body>
</html>
