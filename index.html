<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.A. DRINKS - VIP</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; margin: 0; padding: 10px; text-align: center; }
        h1 { color: #28a745; margin: 25px 0; text-transform: uppercase; letter-spacing: 2px; }
        .input-cliente { width: 90%; padding: 15px; border-radius: 12px; border: 1px solid #333; background: #111; color: #fff; margin-bottom: 25px; font-size: 16px; outline: none; }
        .container { display: grid; gap: 20px; max-width: 450px; margin: auto; padding-bottom: 60px; }
        .card { background: #111; border-radius: 20px; overflow: hidden; border: 1px solid #222; text-align: left; position: relative; }
        .foto { width: 100%; height: 280px; object-fit: cover; display: block; background: #222; }
        .info { padding: 20px; }
        .nome { color: #28a745; font-size: 22px; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
        .comp { color: #aaa; font-size: 14px; line-height: 1.4; margin-bottom: 18px; min-height: 40px; }
        .btn { background: #28a745; color: #fff; border: none; width: 100%; padding: 16px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; text-transform: uppercase; }
        
        /* Overlay de Notificação */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 1000; text-align: center; border: 4px solid #28a745; }
        .btn-ok { background: #28a745; color: #fff; border: none; padding: 15px 40px; border-radius: 10px; margin-top: 30px; font-weight: bold; font-size: 18px; }
    </style>
</head>
<body>

    <audio id="audioBip" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <div id="aviso-pronto" class="overlay">
        <h2 style="color: #28a745; font-size: 32px; margin: 0;">BEBIDA LIBERADA!</h2>
        <p style="font-size: 18px; color: #ccc;">Seu pedido já está no balcão:</p>
        <h3 id="drink-nome-pronto" style="color: #fff; font-size: 26px; text-transform: uppercase; margin: 15px 0;"></h3>
        <button class="btn-ok" onclick="fecharAviso()">RETIRAR AGORA</button>
    </div>

    <h1>S.A. DRINKS</h1>
    <input type="text" id="user" class="input-cliente" placeholder="Seu nome...">

    <div class="container" id="menu-lista"></div>

    <script>
        const firebaseConfig = { databaseURL: "https://sa-drinks-terminal-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        // 6 DRINKS OFICIAIS (FOTOS AJUSTADAS)
        const drinks = [
            { n: "QUANTUM BLUE", i: "Curaçau Blue Zero, Limão Siciliano e Soda.", img: "https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=600" },
            { n: "PINK S.A.", i: "Morango In Natura, Alecrim e Água Tônica.", img: "https://images.unsplash.com/photo-1578314675249-a6910f80cc4e?w=600" },
            { n: "TROPICAL YELLOW", i: "Abacaxi, Gengibre e Água com Gás.", img: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=600" },
            { n: "COFFEE TONIC", i: "Grãos de Café Arábica, Caramelo e Tônica.", img: "https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=600" },
            { n: "GREEN DETOX", i: "Xarope de Maçã Verde, Hortelã Fresca e Soda.", img: "https://images.unsplash.com/photo-1510626176961-4b57d4fbad03?w=600" },
            { n: "SUNSET PEACH", i: "Xarope de Pêssego, Suco de Laranja e Grenadine.", img: "https://images.unsplash.com/photo-1536935338788-846bb9981813?w=600" }
        ];

        const listaDiv = document.getElementById('menu-lista');
        drinks.forEach(d => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="${d.img}" class="foto" onerror="this.src='https://via.placeholder.com/600x400/111/28a745?text=DRINK'">
                <div class="info">
                    <div class="nome">${d.n}</div>
                    <div class="comp">${d.i}</div>
                    <button class="btn" onclick="pedir('${d.n}')">SOLICITAR DRINK</button>
                </div>
            `;
            listaDiv.appendChild(card);
        });

        function pedir(drink) {
            const cliente = document.getElementById('user').value.trim();
            if(!cliente) return alert("S.A. - Por favor, digite seu nome!");

            // Ativa o som no clique (exigência dos navegadores) [cite: 2026-01-23]
            const bip = document.getElementById('audioBip');
            bip.play().then(() => { bip.pause(); bip.currentTime = 0; });

            const novoPedidoRef = db.ref('pedidos').push({
                cliente: cliente,
                drink: drink,
                status: "PENDENTE",
                timestamp: Date.now()
            });

            novoPedidoRef.on('value', (snap) => {
                const pedido = snap.val();
                if(pedido && pedido.status === "PRONTO") {
                    document.getElementById('drink-nome-pronto').innerText = pedido.drink;
                    document.getElementById('aviso-pronto').style.display = 'flex';
                    // TOCA O BIP QUANDO O BARMAN LIBERA
                    bip.play(); 
                }
            });
            alert("Pedido enviado! Aguarde o BIP.");
        }

        function fecharAviso() {
            document.getElementById('aviso-pronto').style.display = 'none';
        }
    </script>
</body>
</html>
