<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.A. DRINKS - SUPREMACIA</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; padding: 15px; text-align: center; }
        .btn { background: #1a1a1a; border: 2px solid #0f0; color: #0f0; padding: 15px; margin: 8px 0; width: 100%; border-radius: 8px; font-weight: bold; font-size: 16px; }
        .card { border: 1px solid #333; padding: 15px; margin: 10px 0; border-radius: 8px; background: #111; text-align: left; border-left: 5px solid #0f0; }
        .status-msg { font-size: 22px; margin-top: 20px; color: gold; font-weight: bold; }
        input { background: #111; border: 1px solid #0f0; color: #fff; padding: 12px; width: 90%; margin-bottom: 15px; border-radius: 5px; }
        .admin-view { color: #fff; background: #222; padding: 10px; border-radius: 5px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="app">
        <h2>🍹 S.A. DRINKS</h2>
        <p style="color: #888;">Digite seu nome e escolha seu drink:</p>
        <input type="text" id="nomeCliente" placeholder="SEU NOME AQUI">
        
        <div id="menu">
            <button class="btn" onclick="pedir('🟦 QUANTUM BLUE')">QUANTUM BLUE</button>
            <button class="btn" onclick="pedir('🌸 PINK S.A.')">PINK S.A.</button>
            <button class="btn" onclick="pedir('🟡 TROPICAL YELLOW')">TROPICAL YELLOW</button>
            <button class="btn" onclick="pedir('🟢 GREEN DETOX')">GREEN DETOX</button>
            <button class="btn" onclick="pedir('☕ COFFEE TONIC')">COFFEE TONIC</button>
            <button class="btn" onclick="pedir('🍑 SUNSET PEACH')">SUNSET PEACH</button>
        </div>
        <div id="status-msg"></div>
    </div>

    <script>
        // Função para simular o pedido na Fila
        function pedir(drink) {
            const nome = document.getElementById('nomeCliente').value;
            if(!nome) { alert("Por favor, digite seu nome!"); return; }
            
            document.getElementById('menu').style.display = 'none';
            document.getElementById('nomeCliente').style.display = 'none';
            document.getElementById('status-msg').innerHTML = `⏳ Olá ${nome}!<br>Estamos preparando seu ${drink}.<br>Aguarde nesta tela...`;
            
            // Simulação de tempo de preparo (Para o GitHub Pages)
            setTimeout(() => {
                document.getElementById('status-msg').innerHTML = `🌟 PRONTO, ${nome}!<br>Seu ${drink} está no balcão.<br>Pode vir buscar!`;
                if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
            }, 10000); // 10 segundos para teste
        }
    </script>
</body>
</html>
