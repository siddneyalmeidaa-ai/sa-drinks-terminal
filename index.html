<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S.A. DRINKS - SUPREMACIA v13.9</title>
    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --primary: #28a745; --neon: #00ff41; --gold: #ffea00; --blue: #0054b2; }
        body { background-color: #000; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 15px; transition: background 0.4s ease; overflow-x: hidden; }
        #app { max-width: 450px; margin: auto; }
        .header { text-align: center; padding: 25px 0; border-bottom: 2px solid var(--blue); margin-bottom: 20px; }
        .logo { font-size: 26px; font-weight: bold; color: var(--primary); letter-spacing: 3px; }
        
        .card { background: #111; border-radius: 15px; border: 1px solid #222; margin-bottom: 20px; overflow: hidden; }
        .img-box { height: 180px; background-size: cover; background-position: center; position: relative; }
        .tag-zero { position: absolute; top: 10px; right: 10px; background: var(--gold); color: #000; padding: 5px 10px; border-radius: 20px; font-size: 10px; font-weight: bold; }
        
        .info { padding: 15px; }
        .nome-drink { font-size: 18px; font-weight: bold; color: var(--primary); display: block; margin-bottom: 5px; }
        .desc { font-size: 12px; color: #888; margin-bottom: 15px; display: block; }
        
        .btn-order { background: var(--primary); color: #fff; border: none; width: 100%; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 14px; }
        .btn-order:active { transform: scale(0.97); }

        #status-area { display: none; text-align: center; margin-top: 50px; padding: 30px 15px; background: rgba(10,10,10,0.95); border: 2px solid var(--primary); border-radius: 20px; }
        .x-display { font-size: 50px; font-weight: 900; margin: 20px 0; color: #fff; }
        
        /* Tabela Favelinha S.R. */
        .favelinha-table { width: 100%; margin-top: 20px; border-collapse: collapse; font-size: 11px; color: #444; }
        .favelinha-table td { border: 1px solid #111; padding: 10px; text-align: center; }

        /* Auto-Aprendizado (Alex) */
        .alex-memory-box { background: #050505; border: 1px dashed var(--gold); padding: 12px; margin-top: 20px; border-radius: 10px; font-size: 10px; color: var(--gold); text-align: left; min-height: 60px; }
        
        /* Overlay de Alerta Verde */
        .flash-active { background-color: var(--neon) !important; color: #000 !important; }
    </style>
</head>
<body>

    <div id="app">
        <div class="header">
            <div class="logo">S.A. DRINKS</div>
            <div style="font-size: 9px; color: var(--gold); margin-top: 4px;">S.R. IDENTITY | IPI ATIVO | v13.9</div>
        </div>

        <input type="text" id="clienteNome" style="width:100%; padding:15px; background:#111; border:1px solid #333; color:white; border-radius:10px; margin-bottom:20px; box-sizing:border-box;" placeholder="Digite seu nome para o histórico...">

        <div class="card">
            <div class="img-box" style="background-image: url('https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=500')">
                <div class="tag-zero">0% ÁLCOOL</div>
            </div>
            <div class="info">
                <span class="nome-drink">QUANTUM BLUE</span>
                <span class="desc">Curaçau Blue & Soda. Injeção de Semente Rosa v13.9.</span>
                <button class="btn-order" onclick="processarInjecao('QUANTUM BLUE')">Solicitar Drink / Injetar</button>
            </div>
        </div>

        <table class="favelinha-table">
            <tr style="color: var(--blue);"><td>BAIXO</td><td>MÉDIO</td><td>ALTO</td></tr>
            <tr><td>R$ 0,10</td><td>R$ 0,20</td><td>R$ 1,00</td></tr>
        </table>
    </div>

    <div id="status-area">
        <div id="label-status" style="font-size: 20px; font-weight: bold; color: var(--primary);">ANALISANDO...</div>
        <div id="valor-x" class="x-display">0.00x</div>
        
        <div class="alex-memory-box" id="quantum-alex">
            [ALEX]: Sincronizando memória acumulativa...
        </div>

        <button class="btn-order" style="background: #222; margin-top: 20px;" onclick="location.reload()">NOVA RODADA</button>
    </div>

    <script>
        // Configuração Database (Padrão Ouro S.R.)
        const firebaseConfig = { databaseURL: "https://sa-drinks-terminal-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // FUNÇÃO DOS SENTIDOS (BIP + VIBRA + VERDE)
        function dispararSensoresSR(alvo) {
            // 1. Visão (Cor Verde)
            document.body.classList.add('flash-active');
            document.getElementById('status-area').style.borderColor = "#000";
            document.getElementById('label-status').style.color = "#000";
            document.getElementById('label-status').innerText = "ENTRA AGORA!";

            // 2. Audição (Bip Quântico)
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 1);

            // 3. Tato (Vibração Fibra)
            if (navigator.vibrate) {
                navigator.vibrate([500, 200, 500, 200, 500]);
            }
        }

        function processarInjecao(drink) {
            const nome = document.getElementById('clienteNome').value || "S.R.";
            
            // Ativa áudio no clique
            const unlock = new AudioContext();

            document.getElementById('app').style.display = 'none';
            document.getElementById('status-area').style.display = 'block';

            // CÁLCULO S.R.: Projeção de Semente Rosa com REGRA -50%
            const projReal = (Math.random() * 7) + 3;
            const alvoFinal = (projReal * 0.50).toFixed(2);
            
            let contador = 0.00;
            const timer = setInterval(() => {
                contador += 0.16;
                document.getElementById('valor-x').innerText = contador.toFixed(2) + "x";

                if (contador >= parseFloat(alvoFinal)) {
                    clearInterval(timer);
                    
                    const acao = alvoFinal >= 2.0 ? "ENTRA" : "PULA";
                    
                    // Dispara Alertas
                    dispararSensoresSR(alvoFinal);

                    // Alex salva o histórico no Auto-Aprendizado
                    const logMsg = `> [ALEX]: ${acao} @ ${alvoFinal}x | Operador: S.R. | Sucesso`;
                    document.getElementById('quantum-alex').innerHTML = logMsg;

                    // Salva no Firebase (Acumulativo)
                    database.ref('pedidos').push({
                        cliente: nome,
                        drink: drink,
                        status: "PRONTO",
                        x: alvoFinal,
                        acao: acao,
                        timestamp: Date.now()
                    });
                }
            }, 45);
        }
    </script>
</body>
</html>
