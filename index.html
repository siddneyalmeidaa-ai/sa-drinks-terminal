<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.A. DRINKS - MENU</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; margin: 0; padding: 10px; text-align: center; }
        h1 { color: #28a745; margin: 25px 0; text-transform: uppercase; letter-spacing: 2px; font-size: 26px; }
        .input-cliente { width: 90%; padding: 18px; border-radius: 15px; border: 1px solid #333; background: #111; color: #fff; margin-bottom: 25px; font-size: 16px; outline: none; box-sizing: border-box; }
        .container { display: grid; gap: 20px; max-width: 480px; margin: auto; padding-bottom: 60px; }
        .card { background: #111; border-radius: 25px; overflow: hidden; border: 1px solid #222; text-align: left; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .foto { width: 100%; height: 260px; object-fit: cover; filter: brightness(0.9); display: block; }
        .info { padding: 22px; }
        .nome { color: #28a745; font-size: 24px; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
        .comp { color: #bbb; font-size: 14px; line-height: 1.5; margin-bottom: 20px; min-height: 42px; }
        .btn { background: #28a745; color: #fff; border: none; width: 100%; padding: 18px; border-radius: 15px; font-weight: bold; font-size: 16px; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn:active { transform: scale(0.98); background: #218838; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); display: none; align-items: center; justify-content: center; flex-direction: column; z-index: 100; text-align: center; }
        .loader { width: 50px; height: 50px; border: 5px solid #222; border-top-color: #28a745; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loading" class="overlay">
        <div class="loader"></div>
        <h2 style="color: #28a745; font-size: 28px; margin: 10px 0;">PEDIDO ENVIADO!</h2>
        <p style="font-size: 18px; color: #fff;">PREPARANDO NO BALCÃO...</p>
        <button onclick="location.reload()" style="margin-top:40px; background:#222; color:#fff; border:none; padding:12px 25px; border-radius:10px; font-weight:bold; cursor:pointer;">NOVO PEDIDO</button>
    </div>

    <h1>S.A. DRINKS</h1>
    <input type="text" id="user" class="input-cliente" placeholder="Seu nome...">

    <div class="container" id="menu-lista">
        </div>

    <script>
        // Configuração Firebase corrigida para o Terminal [cite: 2026-01-27]
        const firebaseConfig = { databaseURL: "https://sa-drinks-terminal-default-rtdb.firebaseio.com/" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();

        // LISTA DOS 6 DRINKS ALINHADA COM INSUMOS E COPOS
        const drinks = [
            { n: "QUANTUM BLUE", i: "Curaçau Blue Zero, Limão Siciliano e Soda.", img: "https://images.unsplash.com/photo-1551024709-8f23befc6f87?w=600" },
            { n: "PINK S.A.", i: "Morango In Natura, Alecrim e Água Tônica.", img: "https://images.unsplash.com/photo-1578314675249-a6910f80cc4e?w=600" },
            { n: "TROPICAL YELLOW", i: "Abacaxi, Gengibre e Água com Gás.", img: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=600" },
            { n: "GREEN DETOX", i: "Xarope de Maçã Verde, Hortelã Fresca e Soda.", img: "https://images.unsplash.com/photo-1536935338788-846bb9981813?w=600" },
            { n: "SUNSET PEACH", i: "Xarope de Pêssego, Suco de Laranja e Grenadine.", img: "https://images.unsplash.com/photo-1544145945-f904253d0c7b?w=600" },
            { n: "COFFEE TONIC", i: "Grãos de Café Arábica, Caramelo e Tônica.", img: "https://images.unsplash.com/photo-1517701604599-bb29b565090c?w=600" }
        ];

        const listaDiv = document.getElementById('menu-lista');
        
        // Renderização automática para evitar erros de tela preta
        drinks.forEach(d => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="${d.img}" class="foto" alt="${d.n}">
                <div class="info">
                    <div class="nome">${d.n}</div>
                    <div class="comp">${d.i}</div>
                    <button class="btn" onclick="pedir('${d.n}')">SOLICITAR DRINK</button>
                </div>
            `;
            listaDiv.appendChild(card);
        });

        function pedir(drink) {
            const cliente = document.getElementById('user').value.trim();
            if(!cliente) return alert("S.A. - Por favor, digite seu nome primeiro!");
            
            document.getElementById('loading').style.display = 'flex';
            
            // Envio para o banco de dados
            db.ref('pedidos').push({
                cliente: cliente,
                drink: drink,
                status: "PENDENTE",
                timestamp: Date.now()
            });
        }
    </script>
</body>
</html>
